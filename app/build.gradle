plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.local.gateadskipper'
    // Material 3 Expressive (material3 1.5 alphas) needs compileSdk 37 and AGP 9.1+.
    compileSdk 37

    defaultConfig {
        applicationId 'com.local.gateadskipper'
        minSdk 26
        targetSdk 36
        // CI run number, so each published build is a newer version than the last.
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName = "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // CI writes the key from the KEYSTORE_B64 secret to app/release.p12 (gitignored) and passes SIGNING_PASSWORD,
    // so every build is signed with the same key and installs over the previous one.
    def releaseKey = file('release.p12')
    def signingPassword = System.getenv('SIGNING_PASSWORD')
    def haveReleaseKey = releaseKey.exists() && signingPassword

    if (haveReleaseKey) {
        signingConfigs {
            release {
                storeFile releaseKey
                storeType 'pkcs12'
                storePassword signingPassword
                keyAlias 'gateadskipper'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 strips the unused parts of Compose and the icon set, keeping the APK small.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Without the key (e.g. a local build), fall back to the debug key.
            signingConfig haveReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha29'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
}
