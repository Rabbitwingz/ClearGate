plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.gateadskipper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.local.gateadskipper'
        minSdk 26
        targetSdk 34
        // CI run number, so each published build is a newer version than the last.
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // CI writes the key from the KEYSTORE_B64 secret to app/release.p12 (gitignored) and passes SIGNING_PASSWORD,
    // so every build is signed with the same key and installs over the previous one.
    def releaseKey = file('release.p12')
    def signingPassword = System.getenv('SIGNING_PASSWORD')
    def haveReleaseKey = releaseKey.exists() && signingPassword

    signingConfigs {
        release {
            if (haveReleaseKey) {
                storeFile releaseKey
                storeType 'pkcs12'
                storePassword signingPassword
                keyAlias 'gateadskipper'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without the key (e.g. a local build), fall back to the debug key.
            signingConfig haveReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
