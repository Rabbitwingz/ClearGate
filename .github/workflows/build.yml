name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK at $ANDROID_HOME; Gradle fetches any missing platform itself.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.0'

      # Restore the fixed signing key from repo secrets. Without it the build still runs (to check the code),
      # but nothing is published, because that APK wouldn't install over the previous one.
      - name: Restore signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.p12
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_B64 / SIGNING_PASSWORD secrets missing: building with a throwaway key and not publishing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: GateAdSkipper-apk
          path: app/build/outputs/apk/release/*.apk

      # Replace the "latest" release so this link always serves the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/GateAdSkipper.apk
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk GateAdSkipper.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest GateAdSkipper.apk \
            --target "$GITHUB_SHA" \
            --title "Gate Ad Skipper v1.${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
